<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:p="primefaces"
    xmlns:ui="jakarta.faces.facelets">
    <p:megaMenu
        orientation="horizontal"
        autoDisplay="false"
        styleClass="border-noround-bottom border-top-none border-left-none border-right-none">
        <f:facet name="start">
            <div class="flex align-items-center gap-2">
                <p:graphicImage name="images/gestao-tickets.png" width="32" style="vertical-align: middle" />
                <span class="font-bold text-lg text-color">Gestão Tickets</span>
            </div>
        </f:facet>

        <f:facet name="end">
            <div class="flex align-items-center gap-3">
                <div class="ui-input-icon-left">
                    <i class="pi pi-fw pi-search" />
                    <p:inputText placeholder="Pesquisar" />
                </div>

                <div class="flex align-items-center px-3 py-1 border-bottom-1 surface-border surface-100 text-sm">
                    <span class="text-color-secondary mr-3">
                        <i class="pi pi-fw pi-user" />
                        #{currentUser.user.displayName ne null ? currentUser.user.displayName : currentUser.username}
                    </span>

                    <h:form id="logoutForm" styleClass="mb-0">
                        <p:commandButton
                            id="logoutButton"
                            value="Sair"
                            icon="pi pi-sign-out"
                            styleClass="ui-button-secondary ui-button-sm"
                            action="#{logoutController.logout}"
                            ajax="false" />
                    </h:form>
                </div>
            </div>
        </f:facet>
    </p:megaMenu>
</ui:composition>
